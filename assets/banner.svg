<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Naveen Gowda — Embedded Systems, AI/LLM Applications, Home Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2336"/>
      <stop offset="1" stop-color="#0a2e2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- subtle circuit traces -->
  <g stroke="#1e3a5f" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 70 H280 V36 H470"/>
    <path d="M1280 270 H1000 V304 H820"/>
    <path d="M1130 70 H960 V130"/>
    <path d="M60 250 H210 V210"/>
  </g>
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="470" cy="36" r="4.5"/>
    <circle cx="820" cy="304" r="4.5"/>
    <circle cx="960" cy="130" r="4.5"/>
    <circle cx="210" cy="210" r="4.5"/>
  </g>

  <!-- agent-graph motif (top right) -->
  <g opacity="0.9">
    <line x1="1080" y1="120" x2="1160" y2="80"  stroke="url(#accent)" stroke-width="3"/>
    <line x1="1080" y1="120" x2="1160" y2="170" stroke="url(#accent)" stroke-width="3"/>
    <line x1="1160" y1="80"  x2="1160" y2="170" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1080" cy="120" r="16" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1160" cy="80"  r="13" fill="#0b1220" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="1160" cy="170" r="13" fill="#0b1220" stroke="#a78bfa" stroke-width="3"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="92" width="6" height="150" rx="3" fill="url(#accent)"/>

  <!-- title + subtitle -->
  <text x="112" y="152" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#f8fafc">Naveen Gowda</text>
  <text x="114" y="198" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" fill="#9fb3c8">Embedded Systems  ·  AI / LLM Applications  ·  Home Automation</text>

  <!-- tech pills -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600">
    <rect x="113" y="232" width="116" height="34" rx="17" fill="#0e2942" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="171" y="255" text-anchor="middle" fill="#7dd3fc">LangGraph</text>

    <rect x="239" y="232" width="118" height="34" rx="17" fill="#0e2942" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="298" y="255" text-anchor="middle" fill="#7dd3fc">AI Agents</text>

    <rect x="367" y="232" width="92" height="34" rx="17" fill="#0e2942" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="413" y="255" text-anchor="middle" fill="#c4b5fd">ESP32</text>

    <rect x="469" y="232" width="108" height="34" rx="17" fill="#0e2942" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="523" y="255" text-anchor="middle" fill="#c4b5fd">Proxmox</text>

    <rect x="587" y="232" width="170" height="34" rx="17" fill="#0e2942" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="672" y="255" text-anchor="middle" fill="#6ee7b7">Home Assistant</text>

    <rect x="767" y="232" width="84" height="34" rx="17" fill="#0e2942" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="809" y="255" text-anchor="middle" fill="#6ee7b7">KiCad</text>
  </g>
</svg>
